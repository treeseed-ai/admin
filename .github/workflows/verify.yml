name: Verify

on:
  push:
    branches: [staging, main]
    paths-ignore: ["docs/src/content/**"]
  pull_request:
    # Required verification must also run for ancestry-only reconciliation PRs.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        timeout-minutes: 20
        env:
          TREESEED_SKIP_PACKAGE_PREPARE: "1"
        run: npm run release:setup

      - name: Download exact integrated UI package
        uses: actions/download-artifact@v4
        with:
          repository: treeseed-ai/ui
          run-id: 36729378278
          name: ui-b0c9a2bdf1eed181950c1202a24ab3d9af012833
          github-token: ${{ github.token }}
          path: .treeseed/ci-ui

      - name: Install exact integrated UI package
        run: npm install --ignore-scripts --no-save --package-lock=false .treeseed/ci-ui/*.tgz

      - name: Verify package
        run: npm run verify:direct

      - name: Verify independent Cloudflare application
        run: npm run build:pages

      - name: Pack verified artifact
        run: mkdir -p artifacts && npm pack --json --ignore-scripts --pack-destination artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: admin-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error
