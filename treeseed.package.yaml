id: "@treeseed/admin"
name: TreeSeed Admin
kind: node-typescript
type: web-application
repository: treeseed-ai/admin
publishTarget: npm
capabilities: { save: true, verify: true, publish: true, deploy: true, localOnly: false }
workflowTemplateVersion: "1"
githubEnvironments:
  - production
requiredSecrets:
  - NPM_TOKEN
  - DOCKERHUB_TOKEN
requiredVariables:
  - DOCKERHUB_USERNAME
verify:
  fast: npm run verify
  local: npm run verify:local
  release: npm run release:verify
artifacts:
  - provider: npm
    name: "@treeseed/admin"
  - provider: docker
    name: "treeseed/admin"
releaseGate:
  workflow: verify.yml
standards:
  schemaVersion: 1
  workflow: { enabled: true }
  acceptedBaseline: { packageName: "@treeseed/admin", packageVersion: "0.12.58" }
  produced:
    - { id: "@treeseed/admin/browser-bff", family: behavioral, version: "1.0.0", semanticRange: "^1.0.0", source: src/pages/auth, artifact: .treeseed/standards/browser-bff.json, verifier: scripts/verify-driver.ts }
  consumed:
    - { id: "@treeseed/sdk/control-plane-catalog", family: json-schema, version: "1.0.0", semanticRange: "^1.0.0", source: node_modules/@treeseed/sdk, verifier: scripts/verify-driver.ts }
    - { id: "@treeseed/core/site-plugin-runtime", family: behavioral, version: "1.0.0", semanticRange: "^1.0.0", source: node_modules/@treeseed/core, verifier: scripts/verify-driver.ts }
    - { id: "@treeseed/ui/presentation-catalog", family: behavioral, version: "1.0.0", semanticRange: "^1.0.0", source: node_modules/@treeseed/ui, verifier: scripts/verify-driver.ts }
  guarantees: [oauth-browser-bff, httponly-token-custody, catalog-driven-account-and-team-management, stateless-managed-runtime]
  deprecations: []
  runtimes: [node>=22]
  rollbackOperations: [remove-prerelease-dist-tag, restore-accepted-composition]
projectArchitecture:
  topology: split_site_content
  rootPath: .
  sitePath: docs
  contentPath: src/content
  contentRuntimeSource: r2_preview_overlay
  localContentMaterialization: none
  contentPublishTarget:
    kind: cloudflare_r2
    prefix: packages/admin
contentContributions:
  - model: books
    path: src/content/books
    runtime: published
  - model: docs
    path: src/content/knowledge
    runtime: published
