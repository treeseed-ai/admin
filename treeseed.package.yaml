id: "@treeseed/admin"
name: TreeSeed Admin
kind: node-typescript
type: web-application
repository: treeseed-ai/admin
publishTarget: npm
capabilities: { save: true, verify: true, publish: true, deploy: true, localOnly: false }
workflowTemplateVersion: "1"
githubEnvironments:
  - production
requiredSecrets:
  - NPM_TOKEN
  - DOCKERHUB_TOKEN
requiredVariables:
  - DOCKERHUB_USERNAME
verify:
  fast: npm run verify
  local: npm run verify:local
  release: npm run release:verify
artifacts:
  - provider: npm
    name: "@treeseed/admin"
  - provider: docker
    name: "treeseed/admin"
releaseGate:
  workflow: verify.yml
development:
  schemaVersion: treeseed.development-runtime/v1
  project: { id: admin, repository: treeseed-ai/admin }
  defaults: { leaseSeconds: 14400, restoreOnFailure: true }
  targets:
    - id: web
      kind: live-web
      platforms: [linux-amd64, linux-arm64, darwin-arm64, darwin-amd64]
      runtimeRequirements: [node>=22, browser]
      sourceRoots: [src, public, scripts/development, astro.config.ts, compose.development.yml]
      ignoredPaths: [dist, node_modules]
      operations:
        setup: { command: npm, args: [run, brand:sync], environment: {}, timeoutSeconds: 120 }
        start: { command: docker, args: [compose, --file, compose.development.yml, --project-name, treeseed-admin-development, up, --abort-on-container-exit, --exit-code-from, admin-live], environment: { TREESEED_DEVELOPMENT_EDGE_HOST: admin-live }, timeoutSeconds: 86400 }
        cleanup: { command: docker, args: [compose, --file, compose.development.yml, --project-name, treeseed-admin-development, down, --remove-orphans], environment: {}, timeoutSeconds: 120 }
        build: { command: npm, args: [run, build], environment: {}, timeoutSeconds: 1800 }
        verify: { command: npm, args: [run, test:unit], environment: {}, timeoutSeconds: 900 }
      ready: { kind: http, path: /healthz, expectedStatus: 200, timeoutSeconds: 120 }
      outputs: []
      endpoints: [{ id: http, protocol: http, port: 4322, canonicalAlias: admin.treeseed.localhost, visibility: host, authentication: application }]
      dependencies:
        - { id: sdk, target: package, locality: local, reaction: restart }
        - { id: ui, target: package, locality: local, reaction: restart }
        - { id: core, target: package, locality: local, reaction: restart }
        - { id: api, target: service, capability: control-plane-api, locality: either, reaction: none }
      statePolicy: stateless
      migrationPolicy: none
      secretRefs: {}
      shutdown: { graceSeconds: 15, activeWorkPolicy: block }
      resources: {}
      logs: [.treeseed/development/web.log]
      forbiddenOperations: [manager-socket, browser-token-exposure]
      freeze:
        kind: npm-package
        operation: { command: npm, args: [pack, --json], environment: {}, timeoutSeconds: 1800 }
        artifacts: [treeseed-admin-*.tgz]
        contractOperations: []
      promotion: { liveAdmissible: false, candidateRequiresVerification: true }
standards:
  schemaVersion: 1
  workflow: { enabled: true }
  acceptedBaseline: { packageName: "@treeseed/admin", packageVersion: "0.12.58" }
  produced:
    - { id: "@treeseed/admin/browser-bff", family: behavioral, version: "1.0.0", semanticRange: "^1.0.0", source: src/pages/auth, artifact: .treeseed/standards/browser-bff.json, verifier: scripts/verify-driver.ts }
    - { id: "@treeseed/admin/guarantee-catalog", family: json-schema, version: "1.0.0", semanticRange: "^1.0.0", source: guarantees, artifact: dist/standards/guarantee-catalog.json, verifier: scripts/verify-driver.ts }
    - { id: "@treeseed/admin/team-ui-contracts", family: behavioral, version: "1.0.0", semanticRange: "^1.0.0", source: src/standards/verifiers/team-ui-contracts.ts, artifact: dist/standards/verifiers/team-ui-contract.json, verifier: dist/standards/verifiers/team-ui-contracts.js }
  consumed:
    - { id: "@treeseed/sdk/control-plane-catalog", family: json-schema, version: "1.0.0", semanticRange: "^1.0.0", source: node_modules/@treeseed/sdk, verifier: scripts/verify-driver.ts }
    - { id: "@treeseed/core/site-plugin-runtime", family: behavioral, version: "1.0.0", semanticRange: "^1.0.0", source: node_modules/@treeseed/core, verifier: scripts/verify-driver.ts }
    - { id: "@treeseed/ui/presentation-catalog", family: behavioral, version: "1.0.0", semanticRange: "^1.0.0", source: node_modules/@treeseed/ui, verifier: scripts/verify-driver.ts }
  guarantees: [oauth-browser-bff, httponly-token-custody, catalog-driven-account-and-team-management, stateless-managed-runtime]
  deprecations: []
  runtimes: [node>=22]
  rollbackOperations: [remove-prerelease-dist-tag, restore-accepted-composition]
projectArchitecture:
  topology: split_site_content
  rootPath: .
  sitePath: docs
  contentPath: src/content
  contentRuntimeSource: r2_preview_overlay
  localContentMaterialization: none
  contentPublishTarget:
    kind: cloudflare_r2
    prefix: packages/admin
contentContributions:
  - model: books
    path: src/content/books
    runtime: published
  - model: docs
    path: src/content/knowledge
    runtime: published
