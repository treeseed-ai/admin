schemaVersion: treeseed.scene/v1
id: user.account.manage-sessions.007
title: Manage Sessions
description: Acceptance scene for guarantee.user.account.manage-sessions.007.
audience:
  - operator
  - evaluator
journey:
  kind: service
  proves:
    - Manage Sessions opens the canonical @treeseed/admin dashboard read model workflow.
    - Manage Sessions exercises a service journey instead of only loading /app/account.
    - Manage Sessions records reviewable evidence for the visible result before activation.
  minimumSteps: 5
  requiresInteractiveAction: true
  consumesState:
    - key: auth.primary-session
      kind: browser-storage
  producesState:
    - key: account.sessions-reviewed
      kind: marker
mode:
  test: true
  demo: true
  training: true
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport:
    width: 1600
    height: 900
devices:
  defaultProfile: desktop_chromium
  profiles:
    - id: desktop_chromium
      title: Desktop Chromium
      orientation: landscape
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      output:
        width: 1920
        height: 1080
      deviceScaleFactor: 1
      isMobile: false
      hasTouch: false
    - id: mobile_chromium
      title: Mobile Chromium
      orientation: portrait
      viewport:
        width: 390
        height: 844
      video:
        width: 390
        height: 844
      output:
        width: 390
        height: 844
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
setup:
  dev:
    required: true
    reuseExisting: true
  auth:
    role: owner
    required: true
artifacts:
  trace: true
  video: true
  screenshots: true
  console: true
  network: true
  timeline: true
  appLogs: true
workflow:
  - id: open-entry-route
    title: Open Manage Sessions
    action:
      goto: /app/account/sessions
    expect:
      urlIncludes: /app/account/sessions
      visible:
        - scene: account-sessions
      text: Current session
  - id: create-revocable-session
    title: Create an additional session owned by this run
    action:
      apiRequest:
        base: api
        path: /v1/auth/web/sign-in
        method: POST
        expectedStatus: 200
        headers:
          user-agent: Treeseed Guarantee Revocable Session
          x-forwarded-for: 198.51.100.27
        body:
          email: guarantee-{{runId}}-{{deviceId}}@treeseed.local
          password: TreeSeedGuaranteeReset123!
    expect:
      urlIncludes: /app/account/sessions
      text: Current session
  - id: reload-session-list
    title: Load the run-owned revocable session
    action:
      goto: /app/account/sessions
    expect:
      visible:
        - scene: account-sessions
      text: Revoke session
  - id: verify-session-network-and-pretty-time
    title: Verify the session network origin and formatted time
    action:
      goto: /app/account/sessions
    expect:
      text: 198.51.100.27
      notText: T00:00:00.000Z
      visible:
        - css: '[data-session-entry="treeseed-guarantee-revocable-session"] [data-session-ip]'
          internal: true
        - css: '[data-session-entry="treeseed-guarantee-revocable-session"] .account-session-signed-in'
          internal: true
  - id: reject-current-session-revocation
    title: Prove no current-session revoke control is exposed
    action:
      goto: /app/account/sessions
    expect:
      urlIncludes: /app/account/sessions
      text: Current session
      notText: Revoke current session
  - id: revoke-extra-session
    title: Revoke the additional non-current session
    action:
      click:
        css: '[data-session-user-agent="treeseed-guarantee-revocable-session"]'
        internal: true
    expect:
      urlIncludes: /app/account/sessions
      text: Session revoked.
      visible:
        - css: '[data-ts-toast-id][data-tone="success"]'
          internal: true
  - id: verify-revoked-session
    title: Verify the revoked session remains observable
    action:
      goto: /app/account/sessions
    expect:
      visible:
        - scene: account-sessions
      text: Revoked
chapters: []
overlays: []
diagrams: []
render:
  remotion:
    composition: treeseed-training-default
    output:
      format: mp4
      fps: 30
      resolution:
        width: 1920
        height: 1080
    capture:
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      evidenceFit: fixed-browser
runtime:
  mode: training
  timeouts:
    sceneSeconds: 300
    chapterSeconds: 120
    stepSeconds: 60
  checkpoints:
    enabled: true
    defaultResumable: true
    everyStep: true
  progress:
    heartbeatSeconds: 15
  failure:
    continueOnFailure: false
training: {}
visualAudit:
  enabled: false
