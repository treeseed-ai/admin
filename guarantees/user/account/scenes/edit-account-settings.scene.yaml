schemaVersion: treeseed.scene/v1
id: user.account.edit-account-settings.006
title: Edit Account Settings
description: Acceptance scene for guarantee.user.account.edit-account-settings.006.
audience:
  - operator
  - evaluator
journey:
  kind: service
  proves:
    - Edit Account Settings opens the canonical @treeseed/admin full page form workflow.
    - Edit Account Settings exercises a service journey instead of only loading /app/account.
    - A signed-in user can add an email, consume the delivered confirmation link, and observe its verified state.
    - Edit Account Settings records reviewable evidence for the visible result before activation.
  minimumSteps: 5
  requiresInteractiveAction: true
  consumesState:
    - key: auth.primary-session
      kind: browser-storage
  producesState:
    - key: account.profile-updated
      kind: marker
mode:
  test: true
  demo: true
  training: true
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport:
    width: 1600
    height: 900
devices:
  defaultProfile: desktop_chromium
  profiles:
    - id: desktop_chromium
      title: Desktop Chromium
      orientation: landscape
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      output:
        width: 1920
        height: 1080
      deviceScaleFactor: 1
      isMobile: false
      hasTouch: false
    - id: mobile_chromium
      title: Mobile Chromium
      orientation: portrait
      viewport:
        width: 390
        height: 844
      video:
        width: 390
        height: 844
      output:
        width: 390
        height: 844
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
setup:
  dev:
    required: true
    reuseExisting: true
  auth:
    role: owner
    required: true
artifacts:
  trace: true
  video: true
  screenshots: true
  console: true
  network: true
  timeline: true
  appLogs: true
workflow:
  - id: open-entry-route
    title: Open Edit Account Settings
    action:
      goto: /app/account
    expect:
      urlIncludes: /app/account
      visible:
        - scene: account-identity
        - css: '[data-page-header-owner="content"] .ts-page-header'
          internal: true
      notVisible:
        - css: '[data-page-header-owner="content"] > .ts-product-shell__body .ts-control-surface > .ts-control-surface__header'
          internal: true
  - id: edit-first-name
    title: Edit the public first name
    action:
      fill:
        role: textbox
        name: First name
        value: Guarantee
    expect:
      text: Public profile
  - id: edit-last-name
    title: Edit the public last name
    action:
      fill:
        role: textbox
        name: Last name
        value: "{{deviceId}}"
    expect:
      text: Public profile
  - id: save-profile
    title: Save account identity
    action:
      click:
        role: button
        name: Save identity
    expect:
      urlIncludes: /app/account
      text: Identity saved.
      visible:
        - css: '[data-ts-toast-id][data-tone="success"]'
          internal: true
  - id: reload-profile
    title: Reload the durable profile
    action:
      goto: /app/account
    expect:
      visible:
        - scene: account-identity
        - scene: account-time-zone
  - id: select-time-zone
    title: Select an account-wide display time zone
    action:
      select:
        role: combobox
        name: Display time zone
        label: America / New York
    expect:
      text: Dates and times across the application use this time zone.
  - id: save-time-zone
    title: Save the display time zone without leaving account settings
    action:
      click:
        role: button
        name: Save time zone
    expect:
      urlIncludes: /app/account
      text: Time zone saved.
      visible:
        - css: '[data-ts-toast-id][data-tone="success"]'
          internal: true
  - id: reload-time-zone
    title: Reload the durable account time zone
    action:
      goto: /app/account
    expect:
      urlIncludes: /app/account
      visible:
        - css: '[data-scene="account-time-zone"][data-time-zone="America/New_York"]'
          internal: true
  - id: enter-additional-email
    title: Enter an additional account email
    action:
      fill:
        role: textbox
        name: Add email
        value: guarantee-extra-{{runId}}-{{deviceId}}@treeseed.local
    expect:
      visible:
        - scene: account-identity
  - id: send-additional-email-verification
    title: Add the pending email and send its verification message
    action:
      click:
        role: button
        name: Add and verify
    expect:
      urlIncludes: /app/account
      text: Verification email sent.
      visible:
        - css: '[data-ts-toast-id][data-tone="success"]'
          internal: true
        - css: '[data-account-email="guarantee-extra-{{runId}}-{{deviceId}}@treeseed.local"][data-account-email-status="pending"]'
          internal: true
  - id: confirm-additional-email
    title: Confirm the additional email while the account session remains active
    action:
      mailpitConfirmLatest:
        mailpitUrl: http://127.0.0.1:8025
        email: guarantee-extra-{{runId}}-{{deviceId}}@treeseed.local
        subjectIncludes: Confirm your Treeseed Market email
        displayInboxSeconds: 1
        displayMessageSeconds: 1
    expect:
      urlIncludes: /app/account
      visible:
        - css: '[data-account-email="guarantee-extra-{{runId}}-{{deviceId}}@treeseed.local"][data-account-email-status="verified"]'
          internal: true
chapters: []
overlays: []
diagrams: []
render:
  remotion:
    composition: treeseed-training-default
    output:
      format: mp4
      fps: 30
      resolution:
        width: 1920
        height: 1080
    capture:
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      evidenceFit: fixed-browser
runtime:
  mode: training
  timeouts:
    sceneSeconds: 300
    chapterSeconds: 120
    stepSeconds: 60
  checkpoints:
    enabled: true
    defaultResumable: true
    everyStep: true
  progress:
    heartbeatSeconds: 15
  failure:
    continueOnFailure: false
training: {}
visualAudit:
  enabled: false
