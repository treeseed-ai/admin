schemaVersion: treeseed.scene/v1
id: user.account.edit-account-settings.006
title: Edit Account Settings
description: Acceptance scene for guarantee.user.account.edit-account-settings.006.
audience:
  - operator
  - evaluator
journey:
  kind: service
  proves:
    - Edit Account Settings opens the canonical @treeseed/admin full page form workflow.
    - Edit Account Settings exercises a service journey instead of only loading /app/account.
    - Edit Account Settings records reviewable evidence for the visible result before activation.
  minimumSteps: 5
  requiresInteractiveAction: true
  consumesState:
    - key: auth.primary-session
      kind: browser-storage
  producesState:
    - key: account.profile-updated
      kind: marker
mode:
  test: true
  demo: true
  training: true
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport:
    width: 1600
    height: 900
devices:
  defaultProfile: desktop_chromium
  profiles:
    - id: desktop_chromium
      title: Desktop Chromium
      orientation: landscape
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      output:
        width: 1920
        height: 1080
      deviceScaleFactor: 1
      isMobile: false
      hasTouch: false
    - id: mobile_chromium
      title: Mobile Chromium
      orientation: portrait
      viewport:
        width: 390
        height: 844
      video:
        width: 390
        height: 844
      output:
        width: 390
        height: 844
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
setup:
  dev:
    required: true
    reuseExisting: true
  auth:
    role: owner
    required: true
artifacts:
  trace: true
  video: true
  screenshots: true
  console: true
  network: true
  timeline: true
  appLogs: true
workflow:
  - id: open-entry-route
    title: Open Edit Account Settings
    action:
      goto: /app/account
    expect:
      urlIncludes: /app/account
      visible:
        - scene: account-identity
  - id: edit-first-name
    title: Edit the public first name
    action:
      fill:
        role: textbox
        name: First name
        value: Guarantee
    expect:
      text: Public profile
  - id: edit-last-name
    title: Edit the public last name
    action:
      fill:
        role: textbox
        name: Last name
        value: "{{deviceId}}"
    expect:
      text: Public profile
  - id: save-profile
    title: Save account identity
    action:
      click:
        role: button
        name: Save identity
    expect:
      urlIncludes: /app/account
      text: Identity saved.
  - id: reload-profile
    title: Reload the durable profile
    action:
      goto: /app/account
    expect:
      visible:
        - scene: account-identity
chapters: []
overlays: []
diagrams: []
render:
  remotion:
    composition: treeseed-training-default
    output:
      format: mp4
      fps: 30
      resolution:
        width: 1920
        height: 1080
    capture:
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      evidenceFit: fixed-browser
runtime:
  mode: training
  timeouts:
    sceneSeconds: 300
    chapterSeconds: 120
    stepSeconds: 60
  checkpoints:
    enabled: true
    defaultResumable: true
    everyStep: true
  progress:
    heartbeatSeconds: 15
  failure:
    continueOnFailure: false
training: {}
visualAudit:
  enabled: false
