schemaVersion: treeseed.scene/v1
id: user.account.view-user-profile.010
title: View User Profile
description: Acceptance scene for guarantee.user.account.view-user-profile.010.
audience:
  - operator
  - evaluator
journey:
  kind: service
  proves:
    - View User Profile opens the public identity-only @treeseed/admin profile.
    - View User Profile does not expose project, catalog, or knowledge distribution links.
    - View User Profile records reviewable evidence for the visible result before activation.
  minimumSteps: 3
  requiresInteractiveAction: true
  consumesState:
    - key: account.profile-updated
      kind: marker
mode:
  test: true
  demo: true
  training: true
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport:
    width: 1600
    height: 900
devices:
  defaultProfile: desktop_chromium
  profiles:
    - id: desktop_chromium
      title: Desktop Chromium
      orientation: landscape
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      output:
        width: 1920
        height: 1080
      deviceScaleFactor: 1
      isMobile: false
      hasTouch: false
    - id: mobile_chromium
      title: Mobile Chromium
      orientation: portrait
      viewport:
        width: 390
        height: 844
      video:
        width: 390
        height: 844
      output:
        width: 390
        height: 844
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
setup:
  dev:
    required: true
    reuseExisting: true
artifacts:
  trace: true
  video: true
  screenshots: true
  console: true
  network: true
  timeline: true
  appLogs: true
workflow:
  - id: open-entry-route
    title: Open the anonymous public profile
    action:
      goto: /u/g-{{runShort}}-{{deviceId}}
    expect:
      urlIncludes: /u/g-
      text: Public TreeSeed account identity.
      visible:
        - scene: profile-template
  - id: verify-private-data-redacted
    title: Verify private identity data is redacted
    action:
      goto: /u/g-{{runShort}}-{{deviceId}}
    expect:
      notText: guarantee-{{runId}}-{{deviceId}}@treeseed.local
  - id: verify-memberships-redacted
    title: Verify memberships are not published
    action:
      goto: /u/g-{{runShort}}-{{deviceId}}
    expect:
      notText: Memberships
  - id: verify-projects-redacted
    title: Verify projects are not published
    action:
      goto: /u/g-{{runShort}}-{{deviceId}}
    expect:
      notText: Projects
  - id: verify-roles-redacted
    title: Verify roles are not published
    action:
      goto: /u/g-{{runShort}}-{{deviceId}}
    expect:
      notText: Roles
  - id: leave-public-profile
    title: Follow the public manager link
    action:
      click:
        role: link
        name: Manager
    expect:
      urlIncludes: /auth/sign-in
      text: Sign in
chapters: []
overlays: []
diagrams: []
render:
  remotion:
    composition: treeseed-training-default
    output:
      format: mp4
      fps: 30
      resolution:
        width: 1920
        height: 1080
    capture:
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      evidenceFit: fixed-browser
runtime:
  mode: training
  timeouts:
    sceneSeconds: 300
    chapterSeconds: 120
    stepSeconds: 60
  checkpoints:
    enabled: true
    defaultResumable: true
    everyStep: true
  progress:
    heartbeatSeconds: 15
  failure:
    continueOnFailure: false
training: {}
visualAudit:
  enabled: false
