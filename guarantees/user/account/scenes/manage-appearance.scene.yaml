schemaVersion: treeseed.scene/v1
id: user.account.manage-appearance.009
title: Manage Appearance
description: Acceptance scene for guarantee.user.account.manage-appearance.009.
audience:
  - operator
  - evaluator
journey:
  kind: service
  proves:
    - Manage Appearance opens the canonical @treeseed/admin dashboard read model workflow.
    - Manage Appearance exercises a service journey instead of only loading /app/account.
    - Manage Appearance records reviewable evidence for the visible result before activation.
  minimumSteps: 8
  requiresInteractiveAction: true
  consumesState:
    - key: auth.primary-session
      kind: browser-storage
  producesState:
    - key: account.appearance-updated
      kind: marker
mode:
  test: true
  demo: true
  training: true
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport:
    width: 1600
    height: 900
devices:
  defaultProfile: desktop_chromium
  profiles:
    - id: desktop_chromium
      title: Desktop Chromium
      orientation: landscape
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      output:
        width: 1920
        height: 1080
      deviceScaleFactor: 1
      isMobile: false
      hasTouch: false
    - id: mobile_chromium
      title: Mobile Chromium
      orientation: portrait
      viewport:
        width: 390
        height: 844
      video:
        width: 390
        height: 844
      output:
        width: 390
        height: 844
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
setup:
  dev:
    required: true
    reuseExisting: true
  auth:
    role: owner
    required: true
artifacts:
  trace: true
  video: true
  screenshots: true
  console: true
  network: true
  timeline: true
  appLogs: true
workflow:
  - id: open-entry-route
    title: Open Manage Appearance
    action:
      goto: /app/account/appearance
    expect:
      urlIncludes: /app/account/appearance
      visible:
        - scene: account-appearance
        - css: '[data-built-in-theme-table]'
          internal: true
  - id: open-theme-dialog
    title: Open personal theme creation
    action:
      click:
        role: button
        name: Create theme
    expect:
      text: Create a personal theme
  - id: name-personal-theme
    title: Name the personal theme
    action:
      fill:
        role: textbox
        name: Theme name
        value: Guarantee {{runId}} {{deviceId}}
    expect:
      visible:
        - css: "[data-personal-theme-builder] [data-personal-theme-base]"
          internal: true
  - id: change-personal-theme-base
    title: Seed the custom palette from another built-in theme
    action:
      select:
        role: combobox
        name: Base theme
        label: Cedar Clay
    expect:
      visible:
        - css: '[data-personal-theme-builder][data-theme-palette-source="cedar"] [data-theme-color-mode="light"][data-theme-color-key="accent"][data-theme-color-value="#b86b3c"]'
          internal: true
  - id: create-personal-theme
    title: Create the personal theme
    action:
      click:
        testId: create-personal-theme-submit
    expect:
      urlIncludes: /app/account/appearance
      text: Theme saved.
      visible:
        - css: '[data-ts-toast-id][data-tone="success"]'
          internal: true
  - id: reload-personal-theme
    title: Reload the personal theme collection
    action:
      goto: /app/account/appearance
    expect:
      visible:
        - scene: account-appearance
  - id: open-appearance-selector
    title: Open the application appearance selector
    action:
      click:
        css: '[data-testid="appearance-menu-trigger"]:visible'
        internal: true
    expect:
      text: Color scheme
  - id: activate-personal-theme
    title: Select the personal theme and reload the appearance page
    action:
      select:
        role: combobox
        name: Color scheme
        label: Guarantee {{runId}} {{deviceId}}
    expect:
      urlIncludes: /app/account/appearance
      visible:
        - css: '[data-active-personal-theme-name="Guarantee {{runId}} {{deviceId}}"]'
          internal: true
chapters: []
overlays: []
diagrams: []
render:
  remotion:
    composition: treeseed-training-default
    output:
      format: mp4
      fps: 30
      resolution:
        width: 1920
        height: 1080
    capture:
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      evidenceFit: fixed-browser
runtime:
  mode: training
  timeouts:
    sceneSeconds: 300
    chapterSeconds: 120
    stepSeconds: 60
  checkpoints:
    enabled: true
    defaultResumable: true
    everyStep: true
  progress:
    heartbeatSeconds: 15
  failure:
    continueOnFailure: false
training: {}
visualAudit:
  enabled: false
