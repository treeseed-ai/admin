schemaVersion: treeseed.scene/v1
id: user.account.delete-user.011
title: Delete User
description: Acceptance scene for guarantee.user.account.delete-user.011.
audience:
  - operator
  - evaluator
journey:
  kind: service
  proves:
    - Delete User opens the canonical @treeseed/admin destructive confirmation workflow.
    - Delete User exercises a service journey instead of only loading /app/account.
    - Delete User records reviewable evidence for the visible result before activation.
  minimumSteps: 10
  requiresInteractiveAction: true
  consumesState:
    - key: auth.onboarding-session
      kind: browser-storage
    - key: auth.logged-out
      kind: marker
    - key: team.deleted
      kind: marker
  producesState:
    - key: account.deleted
      kind: marker
mode:
  test: true
  demo: true
  training: true
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport:
    width: 1600
    height: 900
devices:
  defaultProfile: desktop_chromium
  profiles:
    - id: desktop_chromium
      title: Desktop Chromium
      orientation: landscape
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      output:
        width: 1920
        height: 1080
      deviceScaleFactor: 1
      isMobile: false
      hasTouch: false
    - id: mobile_chromium
      title: Mobile Chromium
      orientation: portrait
      viewport:
        width: 390
        height: 844
      video:
        width: 390
        height: 844
      output:
        width: 390
        height: 844
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
setup:
  dev:
    required: true
    reuseExisting: true
  auth:
    role: owner
    required: true
artifacts:
  trace: true
  video: true
  screenshots: true
  console: true
  network: true
  timeline: true
  appLogs: true
workflow:
  - id: open-entry-route
    title: Open Delete User
    action:
      goto: /app/account/delete
    expect:
      urlIncludes: /app/account/delete
      visible:
        - scene: account-delete
  - id: enter-invalid-confirmation
    title: Enter an invalid deletion confirmation
    action:
      fill:
        role: textbox
        name: Type "DELETE MY ACCOUNT"
        value: DELETE
    expect:
      text: Delete account
  - id: enter-current-password
    title: Reauthenticate account deletion
    action:
      fill:
        css: "#currentPassword"
        internal: true
        value: TreeSeedGuaranteeReset123!
    expect:
      text: Current password
  - id: reject-invalid-deletion
    title: Reject invalid account deletion
    action:
      click:
        role: button
        name: Delete my account
    expect:
      urlIncludes: /app/account/delete
      text: DELETE MY ACCOUNT
  - id: enter-valid-confirmation
    title: Enter the exact deletion confirmation
    action:
      fill:
        css: "#confirmation"
        internal: true
        value: DELETE MY ACCOUNT
    expect:
      text: Delete account
  - id: reauthenticate-valid-deletion
    title: Reauthenticate the valid deletion request
    action:
      fill:
        css: "#currentPassword"
        internal: true
        value: TreeSeedGuaranteeReset123!
    expect:
      text: Current password
  - id: delete-account
    title: Permanently delete the account
    action:
      click:
        role: button
        name: Delete my account
    expect:
      urlIncludes: /auth/sign-in
      visible:
        - role: heading
          name: Sign in
  - id: enter-deleted-account-email
    title: Try the deleted account email
    action:
      fill:
        role: textbox
        name: Email or username
        value: guarantee-{{runId}}-{{deviceId}}@treeseed.local
    expect:
      urlIncludes: /auth/sign-in
  - id: enter-deleted-account-password
    title: Try the deleted account password
    action:
      fill:
        css: "#password"
        internal: true
        value: TreeSeedGuaranteeReset123!
    expect:
      urlIncludes: /auth/sign-in
  - id: reject-deleted-account-login
    title: Reject authentication for the deleted identity
    action:
      click:
        role: button
        name: Sign in
    expect:
      urlIncludes: /auth/sign-in
      text: Authentication failed
chapters: []
overlays: []
diagrams: []
render:
  remotion:
    composition: treeseed-training-default
    output:
      format: mp4
      fps: 30
      resolution:
        width: 1920
        height: 1080
    capture:
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      evidenceFit: fixed-browser
runtime:
  mode: training
  timeouts:
    sceneSeconds: 300
    chapterSeconds: 120
    stepSeconds: 60
  checkpoints:
    enabled: true
    defaultResumable: true
    everyStep: true
  progress:
    heartbeatSeconds: 15
  failure:
    continueOnFailure: false
training: {}
visualAudit:
  enabled: false
