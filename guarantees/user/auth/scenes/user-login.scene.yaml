schemaVersion: treeseed.scene/v1
id: user.auth.user-login.004
title: User Login
description: Acceptance scene for guarantee.user.auth.user-login.004.
audience:
  - operator
  - evaluator
journey:
  kind: service
  proves:
    - anonymous user can open sign-in
    - sign-in continues to the OAuth sign-in boundary without collecting credentials
    - credentials are entered once and approval reaches the authenticated app shell or returns a visible auth error
  minimumSteps: 7
  requiresInteractiveAction: true
  consumesState: []
  producesState:
    - key: auth.primary-session
      kind: browser-storage
mode:
  test: true
  demo: true
  training: true
target:
  app: admin
  environment: local
  baseUrl: auto
  browser: chromium
  viewport:
    width: 1600
    height: 900
devices:
  defaultProfile: desktop_chromium
  profiles:
    - id: desktop_chromium
      title: Desktop Chromium
      orientation: landscape
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      output:
        width: 1920
        height: 1080
      deviceScaleFactor: 1
      isMobile: false
      hasTouch: false
    - id: mobile_chromium
      title: Mobile Chromium
      orientation: portrait
      viewport:
        width: 390
        height: 844
      video:
        width: 390
        height: 844
      output:
        width: 390
        height: 844
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
    - id: tablet_chromium
      title: Tablet Chromium
      orientation: portrait
      viewport:
        width: 820
        height: 1180
      video:
        width: 820
        height: 1180
      output:
        width: 820
        height: 1180
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
    - id: mobile_webkit
      title: Mobile WebKit
      orientation: portrait
      viewport:
        width: 390
        height: 844
      video:
        width: 390
        height: 844
      output:
        width: 390
        height: 844
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
setup:
  dev:
    required: true
    reuseExisting: true
artifacts:
  trace: true
  video: true
  screenshots: true
  console: true
  network: true
  timeline: true
  appLogs: true
workflow:
  - id: open-sign-in
    title: Redirect to the configured Identity authority
    action:
      goto: /auth/sign-in
    expect:
      urlIncludes: /protocol/openid-connect/auth
      visible:
        - css: "input[name='username']"
          internal: true
  - id: enter-identifier
    title: Enter the disposable identity at Keycloak, not Admin
    action:
      fill:
        css: "input[name='username']"
        internal: true
        value: guarantee-{{runId}}-{{deviceId}}@treeseed.local
    expect:
      visible:
        - css: "input[name='password']"
          internal: true
  - id: enter-invalid-password
    title: Enter an invalid password at the identity authority
    action:
      fill:
        css: "input[name='password']"
        internal: true
        value: incorrect-password
    expect:
      visible:
        - css: "input[name='login']"
          internal: true
  - id: reject-invalid-credentials
    title: Reject invalid credentials without creating an application session
    action:
      click:
        css: "input[name='login']"
        internal: true
    expect:
      urlIncludes: /login-actions/authenticate
      visible:
        - css: "input[name='password']"
          internal: true
  - id: enter-fixture-password
    title: Enter the disposable fixture password at the identity authority
    action:
      fill:
        css: "input[name='password']"
        internal: true
        value: TreeSeedGuaranteeReset123!
    expect:
      visible:
        - css: "input[name='login']"
          internal: true
  - id: complete-sign-in
    title: Complete PKCE callback and enter the mapped application account
    action:
      click:
        css: "input[name='login']"
        internal: true
    expect:
      urlIncludes: /app
      visible:
        - scene: app-shell
  - id: reload-session
    title: Reuse the opaque application session
    action:
      goto: /app/
    expect:
      urlIncludes: /app
      visible:
        - scene: app-shell
chapters: []
overlays: []
diagrams: []
render:
  remotion:
    composition: treeseed-training-default
    output:
      format: mp4
      fps: 30
      resolution:
        width: 1920
        height: 1080
    capture:
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      evidenceFit: fixed-browser
runtime:
  mode: training
  timeouts:
    sceneSeconds: 300
    chapterSeconds: 120
    stepSeconds: 60
  checkpoints:
    enabled: true
    defaultResumable: true
    everyStep: true
  progress:
    heartbeatSeconds: 15
  failure:
    continueOnFailure: false
training: {}
visualAudit:
  enabled: false
