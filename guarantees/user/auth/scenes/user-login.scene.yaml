schemaVersion: treeseed.scene/v1
id: user.auth.user-login.004
title: User Login
description: Acceptance scene for guarantee.user.auth.user-login.004.
audience:
  - operator
  - evaluator
journey:
  kind: service
  proves:
    - anonymous user can open sign-in
    - sign-in continues to the OAuth authorization boundary without collecting credentials
    - credentials are entered once and approval reaches the authenticated app shell or returns a visible auth error
  minimumSteps: 7
  requiresInteractiveAction: true
  consumesState:
    - key: credentials.reset
      kind: marker
  producesState:
    - key: auth.primary-session
      kind: browser-storage
mode:
  test: true
  demo: true
  training: true
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport:
    width: 1600
    height: 900
devices:
  defaultProfile: desktop_chromium
  profiles:
    - id: desktop_chromium
      title: Desktop Chromium
      orientation: landscape
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      output:
        width: 1920
        height: 1080
      deviceScaleFactor: 1
      isMobile: false
      hasTouch: false
    - id: mobile_chromium
      title: Mobile Chromium
      orientation: portrait
      viewport:
        width: 390
        height: 844
      video:
        width: 390
        height: 844
      output:
        width: 390
        height: 844
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
    - id: tablet_chromium
      title: Tablet Chromium
      orientation: portrait
      viewport:
        width: 820
        height: 1180
      video:
        width: 820
        height: 1180
      output:
        width: 820
        height: 1180
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
    - id: mobile_webkit
      title: Mobile WebKit
      orientation: portrait
      viewport:
        width: 390
        height: 844
      video:
        width: 390
        height: 844
      output:
        width: 390
        height: 844
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
setup:
  dev:
    required: true
    reuseExisting: true
artifacts:
  trace: true
  video: true
  screenshots: true
  console: true
  network: true
  timeline: true
  appLogs: true
workflow:
  - id: open-sign-in
    title: Open User Login
    action:
      goto: /auth/sign-in
    expect:
      urlIncludes: /auth/sign-in
      text: Sign in
  - id: continue-to-authorization
    title: Continue to the OAuth authorization decision
    action:
      click:
        role: button
        name: Continue to sign in
    expect:
      urlIncludes: /auth/authorize
      text: Authorize access
  - id: enter-authorization-identifier
    title: Enter the account identifier at the authorization boundary
    action:
      fill:
        role: textbox
        name: Email or username
        value: guarantee-{{runId}}-{{deviceId}}@treeseed.local
    expect:
      visible:
        - role: list
          name: Requested permissions
  - id: enter-invalid-authorization-password
    title: Enter invalid credentials at the authorization boundary
    action:
      fill:
        css: input[name='password']
        internal: true
        value: incorrect-password
    expect:
      visible:
        - css: "input[name='password']"
          internal: true
  - id: reject-invalid-authorization
    title: Reject invalid authorization credentials
    action:
      click:
        role: button
        name: Approve
    expect:
      urlIncludes: /auth/authorize
      visible:
        - role: button
          name: Approve
  - id: enter-correct-password
    title: Enter the reset password
    action:
      fill:
        css: input[name='password']
        internal: true
        value: TreeSeedGuaranteeReset123!
    expect:
      visible:
        - css: "input[name='password']"
          internal: true
  - id: submit-sign-in
    title: Submit valid sign in
    action:
      click:
        role: button
        name: Approve
    expect:
      urlIncludes: /app
      visible:
        - scene: app-shell
  - id: reload-authenticated-dashboard
    title: Reload the authenticated dashboard
    action:
      goto: /app
    expect:
      urlIncludes: /app
      visible:
        - scene: app-shell
  - id: reject-authenticated-sign-in
    title: Redirect an active session away from sign in
    action:
      goto: /auth/sign-in
    expect:
      urlIncludes: /app
      visible:
        - scene: app-shell
  - id: reject-authenticated-registration
    title: Redirect an active session away from registration
    action:
      goto: /auth/register
    expect:
      urlIncludes: /app
      visible:
        - scene: app-shell
  - id: reject-authenticated-password-recovery
    title: Redirect an active session away from password recovery
    action:
      goto: /auth/forgot-password
    expect:
      urlIncludes: /app
      visible:
        - scene: app-shell
  - id: reject-authenticated-password-reset
    title: Redirect an active session away from password reset
    action:
      goto: /auth/reset-password?token=active-session-must-not-consume
    expect:
      urlIncludes: /app
      visible:
        - scene: app-shell
  - id: reject-authenticated-email-continuation
    title: Redirect an active session away from the check-email page
    action:
      goto: /auth/check-email
    expect:
      urlIncludes: /app
      visible:
        - scene: app-shell
  - id: reject-authenticated-email-confirmation
    title: Redirect an active session away from email confirmation
    action:
      goto: /auth/confirm-email
    expect:
      urlIncludes: /app
      visible:
        - scene: app-shell
  - id: reject-authenticated-provider-callback
    title: Redirect an active session away from provider callbacks
    action:
      goto: /auth/callback/github
    expect:
      urlIncludes: /app
      visible:
        - scene: app-shell
chapters: []
overlays: []
diagrams: []
render:
  remotion:
    composition: treeseed-training-default
    output:
      format: mp4
      fps: 30
      resolution:
        width: 1920
        height: 1080
    capture:
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      evidenceFit: fixed-browser
runtime:
  mode: training
  timeouts:
    sceneSeconds: 300
    chapterSeconds: 120
    stepSeconds: 60
  checkpoints:
    enabled: true
    defaultResumable: true
    everyStep: true
  progress:
    heartbeatSeconds: 15
  failure:
    continueOnFailure: false
training: {}
visualAudit:
  enabled: false
