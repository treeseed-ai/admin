schemaVersion: treeseed.guarantee/v1
id: guarantee.user.auth.verify-email.002
journeyIndex: 2
type: user
subtype: auth
journey: Verify Email
ownerPackage: "@treeseed/admin"
summary: Verify an additional application contact email without changing the sign-in identity or linking accounts.
status: active
dependencies:
  journeys:
    - 4
  guarantees:
    - guarantee.user.auth.user-login.004
actors:
  allowed:
    - verified_user
  forbidden:
    - anonymous_user
devices:
  required:
    - desktop_chromium
    - tablet_chromium
    - mobile_chromium
  optional:
    - mobile_webkit
gates:
  - core
  - release
preconditions:
  fixtures: []
  notes:
    - A mapped sign-in identity already exists; matching contact emails never link identities.
scene:
  required: true
  manifest: ../account/scenes/edit-account-settings.scene.yaml
  executionKey: admin.account.edit-profile
  mode:
    acceptance: true
    demo: true
    training: true
  entryRoute: /app/account
  componentContract: redirect/session guarantee harness
  expectedEvidence:
    - playwright_trace
    - scene_video
    - screenshot_on_failure
    - console_log
    - network_log
api:
  required: true
  verifierRefs:
    - api.auth.email.lifecycle
content:
  required: false
  verifierRefs: []
audit:
  required: true
  verifierRefs: [api.auth.lifecycle.audit]
negativeCases:
  - id: anonymous-denied
    actor: anonymous_user
    verifierRefs:
      - api.auth.me.requires-user
evidence:
  required:
    - playwright_trace
    - scene_video
    - api_verification_log
  optional:
    - mailpit_message
notes:
  - The shared account scene adds a contact email, consumes its delivered confirmation once, and verifies the resulting record.
  - Identity owns registration, sign-in email verification, and password recovery. Admin does not issue login credentials.
surface: admin-ui
run:
  timeoutSeconds: 300
  requiredForRelease: true
