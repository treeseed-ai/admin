decision: inadmissible
reasons:
  - Mobile graph nodes were populated from scenes whose reports recorded desktop Chromium device metadata and a 1600x900 desktop viewport.
  - Per-device graph status copied aggregate guarantee status instead of using the actual result for the requested device.
  - Several durable verifiers inspected fixture-created records rather than the records created by the corresponding rendered UI journey.
  - Journey 15 asserted the anonymous public profile instead of the required authenticated operational overview.
history:
  immutable: true
  action: Preserve the original report, graph, scene, trace, screenshot, console, network, and API artifacts as historical diagnostics.
  acceptanceUse: forbidden
replacementRequirements:
  - Exact requested and actual device metadata must match before evidence is accepted.
  - UI-created record identifiers must flow through run state to API and audit verifiers.
  - Journeys 12 through 20 and the separate public-profile guarantee must pass from the current source closure.
