negativeCases: ["Historical playback never substitutes current agent definitions and always identifies the exact immutable definition revision.", "Live events never force a historical cursor to the live edge.", "Absent recorded progress is never fabricated.", "A new topology revision never applies an incompatible saved viewport.", "Generated identity and runtime status cannot be edited as design intent.", "Provider supply cannot be widened from an agent definition.", "Simulation definitions never invent a provider identity or execution provider outside the reconciled project grant and provider inventory.", "The Agent Designer never invents metaphor-based controls or fields that are absent from the canonical Zod and API contracts.", "A project does not disappear from Agent authoring merely because it has no agents yet.", "Closing a URL-opened creator never allows live refresh to reopen it.", "A dirty Agent Designer never exits through Close, Escape, browser Back, or page unload without preserving the draft or receiving explicit discard confirmation.", "Easy Simulation Bay never renders generated source editors until the operator requests them.", "Designer, Simulation Bay, the admitted workday Atlas, and Return to Designer never lose the project, immutable definition, or originating inspection path.", "Historical Discussion context cannot authorize current execution.", "Advanced forensic fields never displace the primary human-readable content by default.", "Focusing Atlas never hides global TreeSeed navigation or changes the saved vital density.", "Shrinking a surface never remounts it or discards editor state.", "Escape and browser Back never close a parent before its top nested overlay.", "Easy mode never exposes protected diagnostic evidence.", "Portfolio mode never fits inactive historical topology revisions into the live canvas.", "The interactive event dock never renders an unbounded durable event collection.", "An empty Atlas never leaves the cause unexplained."]
evidence: { required: [guarantee_report] }
notes: ["The reusable Atlas implementation is present but remains planned until Easy/Diagnostic, overlay-first nested detail history, authoring conflicts, Discussion context, and production-shaped simulation workdays produce repeatable evidence.", "The Agent Designer interprets design/agent-manager.html through reusable @treeseed/ui components, while the canonical SDK Zod model and API authoring route remain authoritative over editable capabilities.", "The Build projection carries authorized project choices independently from configured agents so the supported template-first UI can create a project's first repository definition.", "Simulation Bay defaults to a compact readiness explanation; exact generated YAML and MDX remain available through an explicit source control or Diagnostic mode.", "A launched simulation opens its admitted workday in focused Atlas with the originating Designer return path and exact immutable definition revision; historical playback labels that revision as retained evidence.", "Focused Atlas must always expose Shrink while preserving the live or historical projection, viewport, dock, replay cursor, selection, and nested overlay stack.", "Desktop, tablet, and mobile scene runs must all prove expanded/compact vitals, bounded event filtering and paging, exact circuit replay/live return, inline/focused layout, Escape, browser Back, and state restoration.", "The standalone simulation viewer cannot be retired until integrated Atlas proves equivalent live, replay, evaluation, forensic, accessibility, responsive, and machine-readable evidence.", "The live portfolio embeds only a bounded recent event window with its exact durable total. Filters and paging are visible in the dock; complete evidence remains available through bounded forensic APIs and machine-readable CLI/tool surfaces."]
