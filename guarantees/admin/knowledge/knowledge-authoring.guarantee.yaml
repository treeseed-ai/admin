  - { id: nonmember-knowledge-administration-denied, actor: non_member, sceneManifest: ../../project/book/scenes/negative/nonmember-knowledge-access.scene.yaml, executionKey: admin.knowledge.negative.nonmember, verifierRefs: [api.knowledge.control-plane] }
