schemaVersion: treeseed.scene/v1
id: team.team.create-team.012
title: Create Team
description: Acceptance scene for guarantee.team.team.create-team.012.
audience:
  - operator
  - evaluator
journey:
  kind: service
  proves:
    - team.create
  minimumSteps: 8
  requiresInteractiveAction: true
  producesState:
    - key: team.primary
      kind: marker
      value:
        name: gt-{{runShort}}-{{deviceId}}
        displayName: Guarantee {{runShort}} {{deviceId}}
  consumesState:
    - key: auth.primary-session
      kind: browser-storage
mode:
  test: true
  demo: true
  training: true
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport:
    width: 1600
    height: 900
devices:
  defaultProfile: desktop_chromium
  profiles:
    - id: desktop_chromium
      title: Desktop Chromium
      orientation: landscape
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      output:
        width: 1920
        height: 1080
      deviceScaleFactor: 1
      isMobile: false
      hasTouch: false
    - id: tablet_chromium
      title: Tablet Chromium
      orientation: portrait
      viewport:
        width: 820
        height: 1180
      video:
        width: 820
        height: 1180
      output:
        width: 820
        height: 1180
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
    - id: mobile_chromium
      title: Mobile Chromium
      orientation: portrait
      viewport:
        width: 390
        height: 844
      video:
        width: 390
        height: 844
      output:
        width: 390
        height: 844
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
setup:
  dev:
    required: true
    reuseExisting: true
  auth:
    role: owner
    required: true
artifacts:
  trace: true
  video: true
  screenshots: true
  console: true
  network: true
  timeline: true
  appLogs: true
workflow:
  - id: open-entry-route
    title: Open Create Team
    action:
      goto: /app/teams/new
    expect:
      urlIncludes: /app/teams
      visible:
        - css: '[data-scene="team.create.form"]'
          internal: true
  - id: enter-invalid-team-name
    title: Enter an invalid team name
    action:
      fill:
        css: '[data-scene="team.create.form"] input[name="name"]'
        internal: true
        value: Invalid Team Name
    expect:
      urlIncludes: /app/teams/new
      visible:
        - css: '[data-scene="team.create.form"]'
          internal: true
  - id: reject-invalid-team-name
    title: Reject invalid input without creating a team
    action:
      click:
        role: button
        name: Create team
    expect:
      urlIncludes: /app/teams/new
      notText: Team created.
  - id: fill-team-display-name
    title: Fill team display name
    action:
      fill:
        css: '#displayName'
        internal: true
        value: Guarantee {{runShort}} {{deviceId}}
    expect:
      visible:
        - css: '[data-scene="team.create.form"]'
          internal: true
  - id: fill-team-summary
    title: Fill team profile summary
    action:
      fill:
        role: textbox
        name: Profile summary
        value: Team created by the guarantee service journey for downstream UI verification.
    expect:
      visible:
        - css: '[data-scene="team.create.form"]'
          internal: true
  - id: fill-team-name
    title: Fill team name after dependent identity fields
    action:
      fill:
        css: '#name'
        internal: true
        value: gt-{{runShort}}-{{deviceId}}
    expect:
      visible:
        - css: '[data-scene="team.create.form"]'
          internal: true
  - id: submit-team
    title: Submit team creation
    action:
      click:
        role: button
        name: Create team
    expect:
      urlIncludes: /app/teams
      visible:
        - scene: team.overview
  - id: inspect-service-surface
    title: Prove the run-created team appears in the collection
    action:
      goto: /app/teams
    expect:
      urlIncludes: /app/teams
      visible:
        - css: '[data-team-name="gt-{{runShort}}-{{deviceId}}"]'
          internal: true
  - id: await-team-collection-navigation
    title: Let the team collection navigation settle before opening members
    action: { pause: { mode: timed, durationSeconds: 1 } }
    expect:
      urlIncludes: /app/teams
      visible:
        - css: '[data-team-name="gt-{{runShort}}-{{deviceId}}"]'
          internal: true
  - id: inspect-owner-membership
    title: Open members and prove owner management controls
    action:
      click:
        css: '[data-team-name="gt-{{runShort}}-{{deviceId}}"] a[href$="/members"]'
        internal: true
    expect:
      urlIncludes: /members
      text: Invite a member
chapters: []
overlays: []
diagrams: []
render:
  remotion:
    composition: treeseed-training-default
    output:
      format: mp4
      fps: 30
      resolution:
        width: 1920
        height: 1080
    capture:
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      evidenceFit: fixed-browser
runtime:
  mode: training
  timeouts:
    sceneSeconds: 300
    chapterSeconds: 120
    stepSeconds: 60
  checkpoints:
    enabled: true
    defaultResumable: true
    everyStep: true
  progress:
    heartbeatSeconds: 15
  failure:
    continueOnFailure: false
training: {}
visualAudit:
  enabled: true
