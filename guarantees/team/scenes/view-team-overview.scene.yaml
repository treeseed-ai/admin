schemaVersion: treeseed.scene/v1
id: team.team.view-team-overview.015
title: View Team Overview
description: Acceptance scene for guarantee.team.team.view-team-overview.015.
audience:
  - operator
  - evaluator
journey:
  kind: service
  proves:
    - team.collection
    - team.operational-overview
    - team.public-profile
  minimumSteps: 6
  requiresInteractiveAction: true
  consumesState:
    - key: auth.primary-session
      kind: browser-storage
    - key: team.updated
      kind: marker
mode:
  test: true
  demo: true
  training: true
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport:
    width: 1600
    height: 900
devices:
  defaultProfile: desktop_chromium
  profiles:
    - id: desktop_chromium
      title: Desktop Chromium
      orientation: landscape
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      output:
        width: 1920
        height: 1080
      deviceScaleFactor: 1
      isMobile: false
      hasTouch: false
    - id: tablet_chromium
      title: Tablet Chromium
      orientation: portrait
      viewport:
        width: 820
        height: 1180
      video:
        width: 820
        height: 1180
      output:
        width: 820
        height: 1180
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
    - id: mobile_chromium
      title: Mobile Chromium
      orientation: portrait
      viewport:
        width: 390
        height: 844
      video:
        width: 390
        height: 844
      output:
        width: 390
        height: 844
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
setup:
  dev:
    required: true
    reuseExisting: true
  auth:
    role: owner
    required: true
artifacts:
  trace: true
  video: true
  screenshots: true
  console: true
  network: true
  timeline: true
  appLogs: true
workflow:
  - id: open-team-collection
    title: Open the team collection without changing active context
    action:
      goto: /app/teams
    expect:
      urlIncludes: /app/teams
      visible:
        - scene: team.collection
        - css: '[data-team-name="gt-{{runShort}}-{{deviceId}}"]'
          internal: true
  - id: open-operational-overview
    title: Open the authenticated operational overview
    action:
      click:
        css: '[data-team-name="gt-{{runShort}}-{{deviceId}}"] a[href]:has-text("Overview")'
        internal: true
    expect:
      urlIncludes: /app/teams/
      text: Content activity unavailable
      visible:
        - scene: team.overview
        - scene: team.navigation
        - css: '[data-scene="team.navigation"] a[aria-current="page"]'
          internal: true
        - css: '.ts-disclosure-list'
          internal: true
        - scene: team.overview.content-activity
  - id: open-team-activity-help
    title: Open team activity guidance from the audit panel
    action:
      click: { css: 'button[data-ts-help-knowledge-page-id="team.activity"]', internal: true }
    expect:
      visible:
        - { css: '[data-ts-help-dialog][open]', internal: true }
      text: Help is unavailable
  - id: close-team-activity-help
    title: Close team activity guidance and restore focus
    action:
      click: { role: button, name: Close help }
    expect:
      notVisible:
        - { css: '[data-ts-help-dialog][open]', internal: true }
      focused: { css: 'button[data-ts-help-knowledge-page-id="team.activity"]', internal: true }
  - id: inspect-domain-summaries
    title: Continue to the canonical projects collection when summaries are unavailable
    action:
      goto: /app/projects
    expect:
      urlIncludes: /app/projects
  - id: return-and-inspect-navigation
    title: Return through the shared team navigation
    action:
      goto: /app/teams/gt-{{runShort}}-{{deviceId}}
    expect:
      visible:
        - scene: team.navigation
        - scene: team.overview.audit
      text: Audit projection unavailable
  - id: open-public-profile-with-team-context
    title: Open the public profile through access-checked team navigation
    action:
      click:
        role: link
        name: Public profile
    expect:
      urlIncludes: /t/gt-
      visible:
        - scene: knowledge.profile
        - scene: team.navigation
        - css: '[data-scene="team.navigation"] a[aria-current="page"]'
          internal: true
      text: Lifecycle
  - id: return-to-members
    title: Use the authorized member-management tab
    action:
      click:
        role: link
        name: Members
    expect:
      urlIncludes: /members
      visible:
        - scene: team.navigation
chapters: []
overlays: []
diagrams: []
render:
  remotion:
    composition: treeseed-training-default
    output:
      format: mp4
      fps: 30
      resolution:
        width: 1920
        height: 1080
    capture:
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      evidenceFit: fixed-browser
runtime:
  mode: training
  timeouts:
    sceneSeconds: 300
    chapterSeconds: 120
    stepSeconds: 60
  checkpoints:
    enabled: true
    defaultResumable: true
    everyStep: true
  progress:
    heartbeatSeconds: 15
  failure:
    continueOnFailure: false
training: {}
visualAudit:
  enabled: true
