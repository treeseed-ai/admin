schemaVersion: treeseed.scene/v1
id: team.team.delete-team.016
title: Delete Team
description: Acceptance scene for guarantee.team.team.delete-team.016.
audience:
  - operator
  - evaluator
journey:
  kind: service
  proves:
    - Delete Team opens the canonical @treeseed/admin destructive confirmation workflow.
    - Delete Team exercises a service journey instead of only loading /app/teams/visual-audit-team/delete.
    - Delete Team records reviewable evidence for the visible result before activation.
  minimumSteps: 5
  requiresInteractiveAction: true
  consumesState:
    - key: auth.primary-session
      kind: browser-storage
    - key: team.member-removed
      kind: marker
  producesState:
    - key: team.deleted
      kind: marker
mode:
  test: true
  demo: true
  training: true
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport:
    width: 1600
    height: 900
devices:
  defaultProfile: desktop_chromium
  profiles:
    - id: desktop_chromium
      title: Desktop Chromium
      orientation: landscape
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      output:
        width: 1920
        height: 1080
      deviceScaleFactor: 1
      isMobile: false
      hasTouch: false
    - id: mobile_chromium
      title: Mobile Chromium
      orientation: portrait
      viewport:
        width: 390
        height: 844
      video:
        width: 390
        height: 844
      output:
        width: 390
        height: 844
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
setup:
  dev:
    required: true
    reuseExisting: true
  auth:
    role: owner
    required: true
artifacts:
  trace: true
  video: true
  screenshots: true
  console: true
  network: true
  timeline: true
  appLogs: true
workflow:
  - id: open-entry-route
    title: Open Delete Team
    action:
      goto: /app/teams/gt-{{runShort}}-{{deviceId}}/delete
    expect:
      text: No blockers found
  - id: enter-incorrect-confirmation
    title: Enter an incorrect deletion confirmation
    action:
      fill:
        role: textbox
        name: Type "DELETE gt-{{runShort}}-{{deviceId}}"
        value: DELETE wrong-team
    expect:
      text: Delete team
  - id: enter-exact-confirmation
    title: Enter the exact deletion confirmation
    action:
      fill:
        role: textbox
        name: Type "DELETE gt-{{runShort}}-{{deviceId}}"
        value: DELETE gt-{{runShort}}-{{deviceId}}
    expect:
      text: Delete team
  - id: delete-team
    title: Permanently delete the run-owned team
    action:
      click:
        role: button
        name: Delete team
    expect:
      urlIncludes: /app/teams
      notText: Verified {{runShort}} {{deviceId}}
  - id: verify-team-lookup-cleared
    title: Verify the deleted team no longer resolves
    action:
      apiRequest:
        base: web
        method: GET
        path: /t/gt-{{runShort}}-{{deviceId}}
        expectedStatus: 404
    expect:
      urlIncludes: /app/teams
      notText: Verified {{runShort}} {{deviceId}}
chapters: []
overlays: []
diagrams: []
render:
  remotion:
    composition: treeseed-training-default
    output:
      format: mp4
      fps: 30
      resolution:
        width: 1920
        height: 1080
    capture:
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      evidenceFit: fixed-browser
runtime:
  mode: training
  timeouts:
    sceneSeconds: 300
    chapterSeconds: 120
    stepSeconds: 60
  checkpoints:
    enabled: true
    defaultResumable: true
    everyStep: true
  progress:
    heartbeatSeconds: 15
  failure:
    continueOnFailure: false
training: {}
visualAudit:
  enabled: false
