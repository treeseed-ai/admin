schemaVersion: treeseed.scene/v1
id: team.team.edit-team-settings.014
title: Edit Team Settings
description: Acceptance scene for guarantee.team.team.edit-team-settings.014.
audience:
  - operator
  - evaluator
journey:
  kind: service
  proves:
    - Edit Team Settings opens the canonical @treeseed/admin full page form workflow.
    - Edit Team Settings exercises a service journey instead of only loading /app/teams/visual-audit-team/edit.
    - Edit Team Settings records reviewable evidence for the visible result before activation.
  minimumSteps: 5
  requiresInteractiveAction: true
  consumesState:
    - key: auth.primary-session
      kind: browser-storage
    - key: team.active
      kind: marker
  producesState:
    - key: team.updated
      kind: marker
mode:
  test: true
  demo: true
  training: true
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport:
    width: 1600
    height: 900
devices:
  defaultProfile: desktop_chromium
  profiles:
    - id: desktop_chromium
      title: Desktop Chromium
      orientation: landscape
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      output:
        width: 1920
        height: 1080
      deviceScaleFactor: 1
      isMobile: false
      hasTouch: false
    - id: mobile_chromium
      title: Mobile Chromium
      orientation: portrait
      viewport:
        width: 390
        height: 844
      video:
        width: 390
        height: 844
      output:
        width: 390
        height: 844
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
setup:
  dev:
    required: true
    reuseExisting: true
  auth:
    role: owner
    required: true
artifacts:
  trace: true
  video: true
  screenshots: true
  console: true
  network: true
  timeline: true
  appLogs: true
workflow:
  - id: open-entry-route
    title: Open Edit Team Settings
    action:
      goto: /app/teams/gt-{{runShort}}-{{deviceId}}/edit
    expect:
      urlIncludes: /app/teams
      text: Edit team
  - id: update-display-name
    title: Update the public team display name
    action:
      fill:
        css: '#displayName'
        internal: true
        value: Verified {{runShort}} {{deviceId}}
    expect:
      text: Save team
  - id: update-summary
    title: Update the identity-only public summary
    action:
      fill:
        role: textbox
        name: Profile summary
        value: Public identity verified by a complete team settings service journey.
    expect:
      text: Save team
  - id: save-team
    title: Persist the team settings
    action:
      click:
        role: button
        name: Save team
    expect:
      urlIncludes: /edit
      text: Team saved.
      visible:
        - css: '[data-ts-toast-id][data-tone="success"]'
          internal: true
  - id: reload-team
    title: Reload persisted settings
    action:
      goto: /app/teams/gt-{{runShort}}-{{deviceId}}/edit
    expect:
      visible:
        - css: '[data-team-display-name="Verified {{runShort}} {{deviceId}}"]'
          internal: true
chapters: []
overlays: []
diagrams: []
render:
  remotion:
    composition: treeseed-training-default
    output:
      format: mp4
      fps: 30
      resolution:
        width: 1920
        height: 1080
    capture:
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      evidenceFit: fixed-browser
runtime:
  mode: training
  timeouts:
    sceneSeconds: 300
    chapterSeconds: 120
    stepSeconds: 60
  checkpoints:
    enabled: true
    defaultResumable: true
    everyStep: true
  progress:
    heartbeatSeconds: 15
  failure:
    continueOnFailure: false
training: {}
visualAudit:
  enabled: false
