schemaVersion: treeseed.scene/v1
id: team.membership.accept-team-invitation.018
title: Accept Team Invitation
description: Acceptance scene for guarantee.team.membership.accept-team-invitation.018.
audience:
  - operator
  - evaluator
journey:
  kind: service
  proves:
    - Accept Team Invitation opens the canonical @treeseed/admin dashboard read model workflow.
    - Accept Team Invitation exercises a service journey instead of only loading /app/teams/visual-audit-team/members.
    - Accept Team Invitation records reviewable evidence for the visible result before activation.
  minimumSteps: 5
  requiresInteractiveAction: true
  consumesState:
    - key: team.invitation
      kind: marker
  producesState:
    - key: team.membership-accepted
      kind: marker
mode:
  test: true
  demo: true
  training: true
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport:
    width: 1600
    height: 900
devices:
  defaultProfile: desktop_chromium
  profiles:
    - id: desktop_chromium
      title: Desktop Chromium
      orientation: landscape
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      output:
        width: 1920
        height: 1080
      deviceScaleFactor: 1
      isMobile: false
      hasTouch: false
    - id: mobile_chromium
      title: Mobile Chromium
      orientation: portrait
      viewport:
        width: 390
        height: 844
      video:
        width: 390
        height: 844
      output:
        width: 390
        height: 844
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
setup:
  dev:
    required: true
    reuseExisting: true
artifacts:
  trace: true
  video: true
  screenshots: true
  console: true
  network: true
  timeline: true
  appLogs: true
workflow:
  - id: open-exact-invitation
    title: Open the exact invitation from Mailpit
    action:
      mailpitConfirmLatest:
        mailpitUrl: http://127.0.0.1:8025
        email: invite-{{runId}}-{{deviceId}}@treeseed.local
        subjectIncludes: You're invited to join Verified {{runShort}} {{deviceId}}
    expect:
      urlIncludes: /auth/register
      text: Create account
  - id: fill-invited-first-name
    title: Set the invited user's first name
    action:
      fill:
        role: textbox
        name: First name
        value: Invited
    expect:
      text: Create account
  - id: fill-invited-last-name
    title: Set the invited user's last name
    action:
      fill:
        role: textbox
        name: Last name
        value: Member
    expect:
      text: Create account
  - id: fill-invited-username
    title: Set the invited user's username
    action:
      fill:
        role: textbox
        name: Username
        value: i-{{runShort}}-{{deviceId}}
    expect:
      text: Create account
  - id: fill-invited-password
    title: Set the invited user's password
    action:
      fill:
        css: '#registerPassword'
        internal: true
        value: TreeSeedInviteGuarantee123!
    expect:
      text: Create account
  - id: confirm-invited-password
    title: Confirm the invited user's password
    action:
      fill:
        css: 'input[name="confirmPassword"]'
        internal: true
        value: TreeSeedInviteGuarantee123!
    expect:
      text: Create account
  - id: submit-invited-registration
    title: Register and accept as the invited principal
    action:
      click:
        role: button
        name: Create account
    expect:
      urlIncludes: /app
      visible:
        - scene: app-shell
chapters: []
overlays: []
diagrams: []
render:
  remotion:
    composition: treeseed-training-default
    output:
      format: mp4
      fps: 30
      resolution:
        width: 1920
        height: 1080
    capture:
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      evidenceFit: fixed-browser
runtime:
  mode: training
  timeouts:
    sceneSeconds: 300
    chapterSeconds: 120
    stepSeconds: 60
  checkpoints:
    enabled: true
    defaultResumable: true
    everyStep: true
  progress:
    heartbeatSeconds: 15
  failure:
    continueOnFailure: false
training: {}
visualAudit:
  enabled: false
