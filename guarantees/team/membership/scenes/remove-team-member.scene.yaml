schemaVersion: treeseed.scene/v1
id: team.membership.remove-team-member.020
title: Remove Team Member
description: Acceptance scene for guarantee.team.membership.remove-team-member.020.
audience:
  - operator
  - evaluator
journey:
  kind: service
  proves:
    - Remove Team Member opens the canonical @treeseed/admin destructive confirmation workflow.
    - Remove Team Member exercises a service journey instead of only loading /app/teams/visual-audit-team/members.
    - Remove Team Member records reviewable evidence for the visible result before activation.
  minimumSteps: 3
  requiresInteractiveAction: true
  consumesState:
    - key: auth.primary-session
      kind: browser-storage
    - key: team.member-role-changed
      kind: marker
  producesState:
    - key: team.member-removed
      kind: marker
mode:
  test: true
  demo: true
  training: true
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport:
    width: 1600
    height: 900
devices:
  defaultProfile: desktop_chromium
  profiles:
    - id: desktop_chromium
      title: Desktop Chromium
      orientation: landscape
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      output:
        width: 1920
        height: 1080
      deviceScaleFactor: 1
      isMobile: false
      hasTouch: false
    - id: mobile_chromium
      title: Mobile Chromium
      orientation: portrait
      viewport:
        width: 390
        height: 844
      video:
        width: 390
        height: 844
      output:
        width: 390
        height: 844
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
setup:
  dev:
    required: true
    reuseExisting: true
  auth:
    role: owner
    required: true
artifacts:
  trace: true
  video: true
  screenshots: true
  console: true
  network: true
  timeline: true
  appLogs: true
workflow:
  - id: open-entry-route
    title: Open Remove Team Member
    action:
      goto: /app/teams/gt-{{runShort}}-{{deviceId}}/members
    expect:
      text: invite-{{runId}}-{{deviceId}}@treeseed.local
  - id: remove-invited-member
    title: Remove the invited member
    action:
      click:
        css: '[data-scene="team.member.invite-{{runId}}-{{deviceId}}@treeseed.local"] button[data-remove-member]'
        internal: true
    expect:
      urlIncludes: removed=
  - id: verify-member-removed
    title: Verify the member no longer appears
    action:
      goto: /app/teams/gt-{{runShort}}-{{deviceId}}/members
    expect:
      notText: invite-{{runId}}-{{deviceId}}@treeseed.local
chapters: []
overlays: []
diagrams: []
render:
  remotion:
    composition: treeseed-training-default
    output:
      format: mp4
      fps: 30
      resolution:
        width: 1920
        height: 1080
    capture:
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      evidenceFit: fixed-browser
runtime:
  mode: training
  timeouts:
    sceneSeconds: 300
    chapterSeconds: 120
    stepSeconds: 60
  checkpoints:
    enabled: true
    defaultResumable: true
    everyStep: true
  progress:
    heartbeatSeconds: 15
  failure:
    continueOnFailure: false
training: {}
visualAudit:
  enabled: false
