schemaVersion: treeseed.scene/v1
id: team.membership.change-member-role.019
title: Change Member Role
description: Acceptance scene for guarantee.team.membership.change-member-role.019.
audience:
  - operator
  - evaluator
journey:
  kind: service
  proves:
    - Change Member Role opens the canonical @treeseed/admin dashboard read model workflow.
    - Change Member Role exercises a service journey instead of only loading /app/teams/visual-audit-team/members.
    - Change Member Role records reviewable evidence for the visible result before activation.
  minimumSteps: 4
  requiresInteractiveAction: true
  consumesState:
    - key: auth.primary-session
      kind: browser-storage
    - key: team.membership-accepted
      kind: marker
  producesState:
    - key: team.member-role-changed
      kind: marker
mode:
  test: true
  demo: true
  training: true
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport:
    width: 1600
    height: 900
devices:
  defaultProfile: desktop_chromium
  profiles:
    - id: desktop_chromium
      title: Desktop Chromium
      orientation: landscape
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      output:
        width: 1920
        height: 1080
      deviceScaleFactor: 1
      isMobile: false
      hasTouch: false
    - id: mobile_chromium
      title: Mobile Chromium
      orientation: portrait
      viewport:
        width: 390
        height: 844
      video:
        width: 390
        height: 844
      output:
        width: 390
        height: 844
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
setup:
  dev:
    required: true
    reuseExisting: true
  auth:
    role: owner
    required: true
artifacts:
  trace: true
  video: true
  screenshots: true
  console: true
  network: true
  timeline: true
  appLogs: true
workflow:
  - id: open-entry-route
    title: Open Change Member Role
    action:
      goto: /app/teams/gt-{{runShort}}-{{deviceId}}/members
    expect:
      text: invite-{{runId}}-{{deviceId}}@treeseed.local
  - id: choose-reviewer-role
    title: Change the invited member to reviewer
    action:
      select:
        css: '[data-scene="team.member.invite-{{runId}}-{{deviceId}}@treeseed.local"] select[name="roleKey"]'
        internal: true
        value: reviewer
    expect:
      text: invite-{{runId}}-{{deviceId}}@treeseed.local
  - id: save-member-role
    title: Persist the member role
    action:
      click:
        css: '[data-scene="team.member.invite-{{runId}}-{{deviceId}}@treeseed.local"] button[type="submit"]'
        internal: true
    expect:
      urlIncludes: updated=
  - id: verify-member-role
    title: Verify role persistence after reload
    action:
      goto: /app/teams/gt-{{runShort}}-{{deviceId}}/members
    expect:
      visible:
        - css: '[data-scene="team.member.invite-{{runId}}-{{deviceId}}@treeseed.local"][data-scene-state="reviewer"]'
          internal: true
chapters: []
overlays: []
diagrams: []
render:
  remotion:
    composition: treeseed-training-default
    output:
      format: mp4
      fps: 30
      resolution:
        width: 1920
        height: 1080
    capture:
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      evidenceFit: fixed-browser
runtime:
  mode: training
  timeouts:
    sceneSeconds: 300
    chapterSeconds: 120
    stepSeconds: 60
  checkpoints:
    enabled: true
    defaultResumable: true
    everyStep: true
  progress:
    heartbeatSeconds: 15
  failure:
    continueOnFailure: false
training: {}
visualAudit:
  enabled: false
