schemaVersion: treeseed.scene/v1
id: team.membership.invite-team-members.017
title: Invite Team Members
description: Acceptance scene for guarantee.team.membership.invite-team-members.017.
audience:
  - operator
  - evaluator
journey:
  kind: service
  proves:
    - team.member-directory
    - team.invitations
  minimumSteps: 16
  requiresInteractiveAction: true
  consumesState:
    - key: auth.primary-session
      kind: browser-storage
    - key: team.updated
      kind: marker
  producesState:
    - key: team.invitation
      kind: marker
      value:
        recipient: invite-{{runId}}-{{deviceId}}@treeseed.local
        existingRecipient: visual.member@treeseed.io
        revokedRecipient: revoke-{{runId}}-{{deviceId}}@treeseed.local
        mismatchRecipient: mismatch-{{runId}}-{{deviceId}}@treeseed.local
mode:
  test: true
  demo: true
  training: true
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport:
    width: 1600
    height: 900
devices:
  defaultProfile: desktop_chromium
  profiles:
    - id: desktop_chromium
      title: Desktop Chromium
      orientation: landscape
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      output:
        width: 1920
        height: 1080
      deviceScaleFactor: 1
      isMobile: false
      hasTouch: false
    - id: mobile_chromium
      title: Mobile Chromium
      orientation: portrait
      viewport:
        width: 390
        height: 844
      video:
        width: 390
        height: 844
      output:
        width: 390
        height: 844
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
setup:
  dev:
    required: true
    reuseExisting: true
  auth:
    role: owner
    required: true
artifacts:
  trace: true
  video: true
  screenshots: true
  console: true
  network: true
  timeline: true
  appLogs: true
workflow:
  - id: open-entry-route
    title: Open Invite Team Members
    action:
      goto: /app/teams
    expect:
      visible:
        - css: '[data-team-name="gt-{{runShort}}-{{deviceId}}"]'
          internal: true
  - id: open-members
    title: Open membership administration from the run-owned team
    action:
      click:
        css: '[data-team-name="gt-{{runShort}}-{{deviceId}}"] a[href$="/members"]'
        internal: true
    expect:
      urlIncludes: /members
      text: Invite a member
  - id: enter-invalid-recipient
    title: Enter an invalid recipient address
    action:
      fill:
        role: textbox
        name: Recipient email
        value: not-an-email
    expect:
      urlIncludes: /members
  - id: reject-invalid-recipient
    title: Reject the invalid recipient without creating pending state
    action:
      click:
        role: button
        name: Send invitation
    expect:
      urlIncludes: /members
      notText: Invitation sent.
  - id: fill-recipient
    title: Enter a unique invited user
    action:
      fill:
        role: textbox
        name: Recipient email
        value: invite-{{runId}}-{{deviceId}}@treeseed.local
    expect:
      text: Invite a member
  - id: choose-role
    title: Select the initial contributor role
    action:
      select:
        role: combobox
        name: Initial role
        value: contributor
    expect:
      text: Invite a member
  - id: send-invitation
    title: Send the invitation through the member UI
    action:
      click:
        role: button
        name: Send invitation
    expect:
      urlIncludes: /members
      text: Invitation sent.
      visible:
        - css: '[data-ts-toast-id][data-tone="success"]:last-of-type'
          internal: true
  - id: observe-invitation-email
    title: Observe exact invitation delivery in Mailpit
    action:
      mailpitConfirmLatest:
        mailpitUrl: http://127.0.0.1:8025
        email: invite-{{runId}}-{{deviceId}}@treeseed.local
        subjectIncludes: You're invited to join Verified {{runShort}} {{deviceId}}
        navigate: false
    expect:
      urlIncludes: /members
      text: Pending invitations
  - id: fill-existing-recipient
    title: Enter the existing verified fixture user
    action:
      fill:
        role: textbox
        name: Recipient email
        value: visual.member@treeseed.io
    expect:
      text: Invite a member
  - id: send-existing-user-invitation
    title: Send an invitation without silently adding the existing user
    action:
      click:
        role: button
        name: Send invitation
    expect:
      visible:
        - css: '[data-invite-email="visual.member@treeseed.io"]'
          internal: true
      notVisible:
        - css: '[data-member-email="visual.member@treeseed.io"]'
          internal: true
  - id: fill-revocable-recipient
    title: Enter a second run-scoped recipient for resend and revoke
    action:
      fill:
        role: textbox
        name: Recipient email
        value: revoke-{{runId}}-{{deviceId}}@treeseed.local
    expect:
      text: Invite a member
  - id: send-revocable-invitation
    title: Create the second pending invitation through the UI
    action:
      click:
        role: button
        name: Send invitation
    expect:
      visible:
        - css: '[data-invite-email="revoke-{{runId}}-{{deviceId}}@treeseed.local"]'
          internal: true
  - id: resend-pending-invitation
    title: Resend the exact pending invitation
    action:
      click:
        css: '[data-invite-email="revoke-{{runId}}-{{deviceId}}@treeseed.local"] form[action$="/resend"] button'
        internal: true
    expect:
      text: Invitation resent.
      visible:
        - css: '[data-ts-toast-id][data-tone="success"]:last-of-type'
          internal: true
  - id: revoke-pending-invitation
    title: Revoke the exact pending invitation
    action:
      click:
        css: '[data-invite-email="revoke-{{runId}}-{{deviceId}}@treeseed.local"] form[data-ts-method="DELETE"] button'
        internal: true
    expect:
      text: Invitation revoked.
  - id: reload-after-revocation
    title: Reload through the durable team collection after revocation
    action:
      goto: /app/teams
    expect:
      visible:
        - css: '[data-team-name="gt-{{runShort}}-{{deviceId}}"]'
          internal: true
  - id: reopen-members-after-revocation
    title: Reopen pending invitations and prove the revoked record stays absent
    action:
      click:
        css: '[data-team-name="gt-{{runShort}}-{{deviceId}}"] a[href$="/members"]'
        internal: true
    expect:
      notVisible:
        - css: '[data-invite-email="revoke-{{runId}}-{{deviceId}}@treeseed.local"]'
          internal: true
  - id: fill-mismatched-recipient
    title: Enter a pending recipient used by the mismatched-account denial journey
    action:
      fill:
        role: textbox
        name: Recipient email
        value: mismatch-{{runId}}-{{deviceId}}@treeseed.local
    expect:
      text: Invite a member
  - id: send-mismatched-invitation
    title: Create the exact pending invitation used by the browser denial scene
    action:
      click:
        role: button
        name: Send invitation
    expect:
      visible:
        - css: '[data-invite-email="mismatch-{{runId}}-{{deviceId}}@treeseed.local"]'
          internal: true
chapters: []
overlays: []
diagrams: []
render:
  remotion:
    composition: treeseed-training-default
    output:
      format: mp4
      fps: 30
      resolution:
        width: 1920
        height: 1080
    capture:
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      evidenceFit: fixed-browser
runtime:
  mode: training
  timeouts:
    sceneSeconds: 300
    chapterSeconds: 120
    stepSeconds: 60
  checkpoints:
    enabled: true
    defaultResumable: true
    everyStep: true
  progress:
    heartbeatSeconds: 15
  failure:
    continueOnFailure: false
training: {}
visualAudit:
  enabled: true
