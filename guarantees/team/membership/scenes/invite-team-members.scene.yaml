schemaVersion: treeseed.scene/v1
id: team.membership.invite-team-members.017
title: Invite Team Members
description: Acceptance scene for guarantee.team.membership.invite-team-members.017.
audience:
  - operator
  - evaluator
journey:
  kind: service
  proves:
    - Invite Team Members opens the canonical @treeseed/admin record modal form workflow.
    - Invite Team Members exercises a service journey instead of only loading /app/teams/visual-audit-team/members.
    - Invite Team Members records reviewable evidence for the visible result before activation.
  minimumSteps: 5
  requiresInteractiveAction: true
  consumesState:
    - key: auth.primary-session
      kind: browser-storage
    - key: team.updated
      kind: marker
  producesState:
    - key: team.invitation
      kind: marker
mode:
  test: true
  demo: true
  training: true
target:
  app: market
  environment: local
  baseUrl: auto
  browser: chromium
  viewport:
    width: 1600
    height: 900
devices:
  defaultProfile: desktop_chromium
  profiles:
    - id: desktop_chromium
      title: Desktop Chromium
      orientation: landscape
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      output:
        width: 1920
        height: 1080
      deviceScaleFactor: 1
      isMobile: false
      hasTouch: false
    - id: mobile_chromium
      title: Mobile Chromium
      orientation: portrait
      viewport:
        width: 390
        height: 844
      video:
        width: 390
        height: 844
      output:
        width: 390
        height: 844
      deviceScaleFactor: 2
      isMobile: true
      hasTouch: true
setup:
  dev:
    required: true
    reuseExisting: true
  auth:
    role: owner
    required: true
artifacts:
  trace: true
  video: true
  screenshots: true
  console: true
  network: true
  timeline: true
  appLogs: true
workflow:
  - id: open-entry-route
    title: Open Invite Team Members
    action:
      goto: /app/teams/gt-{{runShort}}-{{deviceId}}/members
    expect:
      text: Invite member
  - id: fill-recipient
    title: Enter a unique invited user
    action:
      fill:
        role: textbox
        name: Email
        value: invite-{{runId}}-{{deviceId}}@treeseed.local
    expect:
      text: Invite member
  - id: choose-role
    title: Select the initial contributor role
    action:
      select:
        role: combobox
        name: Role
        value: contributor
    expect:
      text: Invite member
  - id: send-invitation
    title: Send the invitation through the member UI
    action:
      click:
        role: button
        name: Invite member
    expect:
      text: Invite sent to invite-{{runId}}-{{deviceId}}@treeseed.local.
  - id: observe-invitation-email
    title: Observe exact invitation delivery in Mailpit
    action:
      mailpitConfirmLatest:
        mailpitUrl: http://127.0.0.1:8025
        email: invite-{{runId}}-{{deviceId}}@treeseed.local
        subjectIncludes: You're invited to join Verified {{runShort}} {{deviceId}}
        navigate: false
    expect:
      urlIncludes: /members
      text: Invite sent
chapters: []
overlays: []
diagrams: []
render:
  remotion:
    composition: treeseed-training-default
    output:
      format: mp4
      fps: 30
      resolution:
        width: 1920
        height: 1080
    capture:
      viewport:
        width: 1600
        height: 900
      video:
        width: 1600
        height: 900
      evidenceFit: fixed-browser
runtime:
  mode: training
  timeouts:
    sceneSeconds: 300
    chapterSeconds: 120
    stepSeconds: 60
  checkpoints:
    enabled: true
    defaultResumable: true
    everyStep: true
  progress:
    heartbeatSeconds: 15
  failure:
    continueOnFailure: false
training: {}
visualAudit:
  enabled: false
