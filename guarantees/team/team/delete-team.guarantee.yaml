    - guarantee.team.team.view-public-team-profile.021
actors:
  allowed:
    - team_admin
    - team_owner
  forbidden:
    - project_lead
devices:
  required:
    - desktop_chromium
    - mobile_chromium
gates:
  - core
  - release
preconditions:
  fixtures:
    - integrated_treeseed_project
  notes:
    - Membership lifecycle and public profile verification must finish before deletion.
uiFeature:
  contract: ../team-management.ui-feature.yaml
  capabilities: [team.lifecycle]
scene:
  required: true
  manifest: ../scenes/delete-team.scene.yaml
  executionKey: admin.team.delete
  mode:
    acceptance: true
    demo: true
    training: true
  entryRoute: /app/teams/[teamId]/delete
  componentContract: destructive-confirmation service journey
  expectedEvidence:
    - playwright_trace
    - scene_video
    - screenshot_on_failure
    - console_log
    - network_log
