schemaVersion: treeseed.guarantee/v1
id: guarantee.team.team.view-team-overview.015
journeyIndex: 15
type: team
subtype: team
journey: View Team Overview
ownerPackage: "@treeseed/admin"
summary: Display the authenticated operational team overview and preserve access-checked team navigation when a member opens the public profile.
status: active
dependencies:
  journeys:
    - 14
  guarantees:
    - guarantee.team.team.edit-team-settings.014
actors:
  allowed:
    - team_member
  forbidden:
    - anonymous_user
    - non_member
devices:
  required:
    - desktop_chromium
    - tablet_chromium
    - mobile_chromium
gates:
  - core
  - release
preconditions:
  fixtures:
    - integrated_treeseed_project
  notes:
    - "Journey dependencies must be satisfied: 12"
scene:
  required: true
  manifest: ../scenes/view-team-overview.scene.yaml
  executionKey: admin.team.overview
  mode:
    acceptance: true
    demo: true
    training: true
  entryRoute: /app/teams/[teamId]
  componentContract: authenticated operational team overview
  expectedEvidence:
    - playwright_trace
    - scene_video
    - screenshot_on_failure
    - console_log
    - network_log
api:
  required: true
  verifierRefs:
    - api.team.overview.correlated
content:
  required: false
  verifierRefs: []
audit:
  required: false
  verifierRefs: []
negativeCases:
  - id: anonymous-denied
    actor: anonymous_user
    sceneManifest: ../scenes/negative/anonymous-team-access.scene.yaml
    executionKey: admin.team.negative.anonymous-access
    verifierRefs: [api.team.overview.anonymous-denied]
  - id: non-member-denied
    actor: non_member
    sceneManifest: ../scenes/negative/overview-nonmember.scene.yaml
    executionKey: admin.team.negative.overview-nonmember
    verifierRefs: [api.team.overview.nonmember-denied]
evidence:
  required:
    - playwright_trace
    - scene_video
    - api_verification_log
  optional:
    - mailpit_message
notes:
  - Public identity is covered separately by guarantee.team.team.view-public-team-profile.021.
uiFeature:
  contract: ../team-management.ui-feature.yaml
  capabilities: [team.collection, team.operational-overview, team.public-profile]
surface: admin-ui
run:
  timeoutSeconds: 300
  requiredForRelease: true
