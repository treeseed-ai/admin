services:
  admin-live:
    image: node:24-bookworm-slim
    working_dir: ${TREESEED_DEVELOPMENT_WORKTREE:?TreeSeed development worktree is required}
    init: true
    read_only: true
    command: ["node", "--import", "tsx", "scripts/development/live-web.ts"]
    environment:
      HOST: 0.0.0.0
      PORT: "4322"
      HOME: /tmp/treeseed-admin-home
      NODE_ENV:
      NODE_EXTRA_CA_CERTS:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: admin.treeseed.localhost
      TREESEED_WEB_RUNTIME_TARGET: managed-node
      TREESEED_API_BASE_URL:
      TREESEED_API_AUDIENCE:
      TREESEED_API_CA_FILE:
      TREESEED_API_CREDENTIAL_FILE:
      TREESEED_SITE_URL:
      TREESEED_REVIEWER_URL:
      TREESEED_AUTH_MODE:
      TREESEED_AUTH_INTERNAL_SIGNUP:
      TREESEED_AUTH_EMAIL_FROM:
      TREESEED_AUTH_EMAIL_REPLY_TO:
      TREESEED_AUTH_EMAIL_VERIFICATION_ENABLED:
      TREESEED_BETTER_AUTH_SECRET:
      TREESEED_WEB_SERVICE_ID:
      TREESEED_WEB_SERVICE_SECRET:
      TREESEED_WEB_ASSERTION_SECRET:
      TREESEED_WEB_CSRF_SECRET:
      TREESEED_MAILPIT_SMTP_HOST:
      TREESEED_MAILPIT_SMTP_PORT:
      TREESEED_DEVELOPMENT_SESSION_ID:
      TREESEED_DEVELOPMENT_MODE:
      TREESEED_DEVELOPMENT_WORKSPACE_ROOT:
      TREESEED_DEVELOPMENT_WORKTREE:
    ports:
      - "127.0.0.1:4322:4322"
    volumes:
      - ${TREESEED_DEVELOPMENT_WORKSPACE_ROOT:?TreeSeed development workspace root is required}:${TREESEED_DEVELOPMENT_WORKSPACE_ROOT:?TreeSeed development workspace root is required}:ro
      - /etc/treeseed/cli/localhost-ca.crt:/etc/treeseed/cli/localhost-ca.crt:ro
    tmpfs:
      - /tmp
      - ${TREESEED_DEVELOPMENT_WORKTREE:?TreeSeed development worktree is required}/.astro
      - ${TREESEED_DEVELOPMENT_WORKTREE:?TreeSeed development worktree is required}/node_modules/.astro
      - ${TREESEED_DEVELOPMENT_WORKTREE:?TreeSeed development worktree is required}/node_modules/.vite
    networks:
      - edge
      - platform
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4322/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 60
    stop_grace_period: 15s

networks:
  edge:
    external: true
    name: treeseed-edge
  platform:
    external: true
    name: treeseed-platform
